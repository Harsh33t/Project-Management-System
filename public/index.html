<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS PAM — Tactical Command Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/chatbot.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --g: #00ff41;
      --g-dim: rgba(0,255,65,.25);
      --r: #ff0055;
      --c: #00d9ff;
      --y: #ffd700;
      --m: #ff4fd8;
    }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
    }

    /* ─── STARFIELD ─────────────────────────────────────── */
    #bgCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── HERO / TITLE SCREEN ───────────────────────────── */
    #heroScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity .8s ease;
    }

    .hero-score-hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 20px 30px;
      font-size: .55rem;
      pointer-events: none;
    }

    .hud-left { color: var(--g); }
    .hud-right { color: rgba(255,255,255,.5); text-align: right; }
    .hud-center { color: var(--y); text-align: center; }

    .hero-title {
      text-align: center;
      line-height: 1;
      user-select: none;
    }

    .hero-title .nexus-word {
      font-size: clamp(3rem, 14vw, 10rem);
      color: var(--g);
      text-shadow: 0 0 20px rgba(0,255,65,.6), 0 0 60px rgba(0,255,65,.2);
      display: block;
      letter-spacing: .1em;
    }

    .hero-title .pam-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .3em;
      font-size: clamp(3rem, 14vw, 10rem);
      margin-top: -.05em;
    }

    .hero-ship-svg {
      width: clamp(2.5rem, 10vw, 8rem);
      height: clamp(2.5rem, 10vw, 8rem);
      animation: floatShip 3s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(0,255,65,.7));
    }

    @keyframes floatShip {
      0%,100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-12px) rotate(3deg); }
    }

    .hero-invader {
      animation: wiggle 1.6s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px rgba(255,0,85,.8));
      margin-bottom: 1.5rem;
    }

    @keyframes wiggle {
      from { transform: translateX(-18px) rotate(-5deg); }
      to   { transform: translateX(18px) rotate(5deg); }
    }

    .hero-nav {
      display: flex;
      gap: .8rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2.5rem;
    }

    .hero-nav a, .hero-nav button {
      font-family: 'Press Start 2P', monospace;
      font-size: .6rem;
      padding: .6rem 1.2rem;
      border: 1px solid;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s, box-shadow .2s;
    }

    .hero-nav .btn-g { border-color: var(--g); color: var(--g); }
    .hero-nav .btn-g:hover { background: rgba(0,255,65,.12); box-shadow: 0 0 12px rgba(0,255,65,.3); }
    .hero-nav .btn-y { border-color: var(--y); color: var(--y); }
    .hero-nav .btn-y:hover { background: rgba(255,215,0,.12); box-shadow: 0 0 12px rgba(255,215,0,.3); }
    .hero-nav .btn-c { border-color: var(--c); color: var(--c); }
    .hero-nav .btn-c:hover { background: rgba(0,217,255,.12); box-shadow: 0 0 12px rgba(0,217,255,.3); }
    .hero-nav .btn-r { border-color: var(--r); color: #ff8a8a; }
    .hero-nav .btn-r:hover { background: rgba(255,0,85,.12); box-shadow: 0 0 12px rgba(255,0,85,.3); }

    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .insert-coin {
      font-size: .5rem;
      color: rgba(255,255,255,.6);
      margin-top: 1.5rem;
      letter-spacing: .2em;
    }

    /* ─── GAME CANVAS ────────────────────────────────────── */
    #gameCanvas {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
    }

    /* ─── GAME HUD ───────────────────────────────────────── */
    #gameHUD {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      pointer-events: none;
      padding: 16px 24px;
      font-size: .6rem;
    }

    .game-hud-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: var(--g);
    }

    .game-hud-row span { color: #fff; }

    #gameHUD .esc-hint {
      margin-top: 8px;
      font-size: .5rem;
      opacity: .5;
      color: var(--g);
      text-align: center;
    }

    /* ─── THEME SWITCHER ─────────────────────────────────── */
    #themeBar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      gap: 8px;
      pointer-events: all;
    }

    .theme-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3);
      cursor: pointer;
      transition: transform .2s, border-color .2s;
    }

    .theme-dot:hover, .theme-dot.active { transform: scale(1.4); border-color: #fff; }

    /* ─── SCANLINES OVERLAY ──────────────────────────────── */
    #scanlines {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.08) 2px,
        rgba(0,0,0,.08) 4px
      );
    }

    /* ─── CRT VIGNETTE ───────────────────────────────────── */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 99;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.7) 100%);
    }

    /* ─── SCROLL HINT ────────────────────────────────────── */
    .scroll-hint {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .45rem;
      color: rgba(255,255,255,.35);
      animation: float 2s ease-in-out infinite;
      letter-spacing: .2em;
    }
    @keyframes float { 0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)} }
  </style>
</head>
<body>

<!-- Background starfield (no auth-guard needed) -->
<canvas id="bgCanvas"></canvas>

<!-- Scanlines & Vignette overlays -->
<div id="scanlines"></div>
<div id="vignette"></div>

<!-- ══════════ HERO SCREEN ══════════ -->
<div id="heroScreen">
  <div class="hero-score-hud">
    <div class="hud-left">
      SCORE: <span style="color:#fff">040892</span><br>
      LIVES: <span style="color:var(--r)">♥ ♥ ♥</span>
    </div>
    <div class="hud-center">
      STAGE 01<br>
      <span class="blink" style="font-size:.45rem; color:rgba(255,255,255,.5)">INSERT COIN</span>
    </div>
    <div class="hud-right">
      HI-SCORE: 99999<br>
      <span style="font-size:.45rem; color:rgba(0,217,255,.6)">SECTOR ALPHA</span>
    </div>
  </div>

  <!-- Enemy invader above title -->
  <div class="hero-invader">
    <svg width="56" height="40" viewBox="0 0 15 10" fill="var(--r)">
      <rect x="4" y="0" width="7" height="1"/><rect x="3" y="1" width="9" height="1"/>
      <rect x="2" y="2" width="11" height="1"/><rect x="2" y="3" width="2" height="1"/>
      <rect x="5" y="3" width="5" height="1"/><rect x="11" y="3" width="2" height="1"/>
      <rect x="0" y="4" width="15" height="1"/><rect x="2" y="5" width="2" height="1"/>
      <rect x="5" y="5" width="5" height="1"/><rect x="11" y="5" width="2" height="1"/>
    </svg>
  </div>

  <!-- Main title -->
  <div class="hero-title">
    <span class="nexus-word">NEXUS</span>
    <div class="pam-row">
      <span>P</span>
      <svg class="hero-ship-svg" viewBox="0 0 16 16">
        <rect x="7" y="0" width="2" height="4" fill="#fff"/>
        <rect x="6" y="4" width="4" height="6" fill="var(--g)"/>
        <rect x="4" y="6" width="8" height="4" fill="var(--g)"/>
        <rect x="2" y="10" width="12" height="2" fill="#008f11"/>
        <rect x="0" y="12" width="4" height="4" fill="var(--r)"/>
        <rect x="12" y="12" width="4" height="4" fill="var(--r)"/>
        <rect x="7" y="10" width="2" height="6" fill="var(--g)"/>
      </svg>
      <span>M</span>
    </div>
  </div>

  <!-- Nav links -->
  <nav class="hero-nav">
    <a href="/dashboard.html" class="btn-g">[DASHBOARD]</a>
    <a href="/projects.html" class="btn-y">[PROJECTS]</a>
    <a href="/activity.html" class="btn-c">[ACTIVITY]</a>
    <button onclick="localStorage.removeItem('nexus_token');localStorage.removeItem('nexus_user');window.location.href='/login.html'" class="btn-r">[LOGOUT]</button>
  </nav>

  <div class="insert-coin blink">▼ SCROLL OR SWIPE UP TO LAUNCH GAME ▼</div>

  <!-- Scroll hint -->
  <div class="scroll-hint">TACTICAL COMMAND PLATFORM v2.0</div>
</div>

<!-- ══════════ ARCADE GAME ══════════ -->
<canvas id="gameCanvas"></canvas>
<div id="gameHUD">
  <div class="game-hud-row">
    <div>SCORE: <span id="hudScore">0</span></div>
    <div>LEVEL: <span id="hudLevel">1</span></div>
    <div>LIVES: <span id="hudLives">♥ ♥ ♥</span></div>
  </div>
  <div class="esc-hint blink">[ ESC ] ABORT MISSION</div>
</div>

<!-- ══════════ THEME BAR ══════════ -->
<div id="themeBar">
  <div class="theme-dot active" style="background:var(--g)" data-theme="green" title="NEON GREEN"></div>
  <div class="theme-dot" style="background:var(--c)" data-theme="cyan" title="CYBER CYAN"></div>
  <div class="theme-dot" style="background:var(--m)" data-theme="magenta" title="PLASMA PINK"></div>
  <div class="theme-dot" style="background:var(--y)" data-theme="gold" title="SOLAR GOLD"></div>
  <div class="theme-dot" style="background:#ff6633" data-theme="volcanic" title="VOLCANIC"></div>
  <div class="theme-dot" style="background:#aa00ff" data-theme="void" title="VOID PURPLE"></div>
</div>

<script src="/chatbot.js"></script>
<script>
// ════════════════════════════════════════════════════
//  NEXUS PAM — LANDING PAGE ENGINE
// ════════════════════════════════════════════════════

/* ──── STARFIELD ──────────────────────────────────── */
(function() {
  const c = document.getElementById('bgCanvas');
  const ctx = c.getContext('2d');
  let w, h, stars=[];
  const resize = () => {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
    stars = Array.from({length:200}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      s: Math.random()*2.2, v: Math.random()*.6+.1,
      a: Math.random()*.7+.3
    }));
  };
  window.addEventListener('resize', resize); resize();
  const draw = () => {
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,0,w,h);
    stars.forEach(s=>{
      ctx.fillStyle=`rgba(255,255,255,${s.a*(0.6+Math.random()*.4)})`;
      ctx.fillRect(s.x,s.y,s.s,s.s);
      s.y+=s.v; if(s.y>h){s.y=-4;s.x=Math.random()*w;}
    });
    requestAnimationFrame(draw);
  };
  draw();
})();

/* ──── THEME SWITCHER ─────────────────────────────── */
const THEMES = {
  green:    {primary:'#00ff41', secondary:'#ff0055', accent:'#00d9ff'},
  cyan:     {primary:'#00d9ff', secondary:'#ff0055', accent:'#00ff41'},
  magenta:  {primary:'#ff4fd8', secondary:'#00d9ff', accent:'#00ff41'},
  gold:     {primary:'#ffd700', secondary:'#ff0055', accent:'#00d9ff'},
  volcanic: {primary:'#ff6633', secondary:'#ffaa00', accent:'#ff0055'},
  void:     {primary:'#aa00ff', secondary:'#ff4fd8', accent:'#00d9ff'},
};
let activeTheme = localStorage.getItem('nexus_theme') || 'green';

function applyTheme(name) {
  const t = THEMES[name] || THEMES.green;
  document.documentElement.style.setProperty('--g', t.primary);
  document.documentElement.style.setProperty('--r', t.secondary);
  document.documentElement.style.setProperty('--c', t.accent);
  activeTheme = name;
  localStorage.setItem('nexus_theme', name);
  document.querySelectorAll('.theme-dot').forEach(d => {
    d.classList.toggle('active', d.dataset.theme === name);
  });
}

document.querySelectorAll('.theme-dot').forEach(d => {
  d.addEventListener('click', () => applyTheme(d.dataset.theme));
});
applyTheme(activeTheme);

/* ──── AUDIO ENGINE ───────────────────────────────── */
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur, type='square', vol=0.06) {
  const ac = getAudio();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ac.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq*0.3, ac.currentTime+dur);
  gain.gain.setValueAtTime(vol, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(); osc.stop(ac.currentTime+dur);
}
const SND = {
  shoot:   ()=>beep(900,0.08,'square',0.05),
  explode: ()=>beep(120,0.25,'sawtooth',0.1),
  level:   ()=>{beep(400,0.1);setTimeout(()=>beep(600,0.15),120);setTimeout(()=>beep(800,0.2),260);},
  die:     ()=>beep(80,0.5,'sawtooth',0.12),
};

/* ──── GAME ENGINE ────────────────────────────────── */
const heroScreen = document.getElementById('heroScreen');
const gameCanvas = document.getElementById('gameCanvas');
const gameHUD    = document.getElementById('gameHUD');
const gc         = gameCanvas.getContext('2d');

const GS = {
  running: false,
  score: 0, lives: 3, level: 1,
  ship: { x:0, y:0, w:40, h:48, targetX:0 },
  bullets: [],
  enemies: [],
  particles: [],
  spawnTimer: 0,
  spawnInterval: 90,
  bulletTimer: 0,
  bulletInterval: 18,
  frameCount: 0,
};

function startGame() {
  GS.running = true;
  GS.score = 0; GS.lives = 3; GS.level = 1;
  GS.bullets = []; GS.enemies = []; GS.particles = [];
  GS.ship.x = window.innerWidth / 2;
  GS.ship.y = window.innerHeight - 80;
  GS.ship.targetX = GS.ship.x;
  GS.spawnInterval = 90;
  GS.bulletInterval = 18;
  GS.frameCount = 0;

  gameCanvas.width = window.innerWidth;
  gameCanvas.height = window.innerHeight;
  gameCanvas.style.display = 'block';
  gameHUD.style.display = 'block';
  heroScreen.style.opacity = '0';
  heroScreen.style.pointerEvents = 'none';

  updateHUD();
  gameLoop();
}

function stopGame() {
  GS.running = false;
  gameCanvas.style.display = 'none';
  gameHUD.style.display = 'none';
  heroScreen.style.opacity = '1';
  heroScreen.style.pointerEvents = 'all';
}

function updateHUD() {
  document.getElementById('hudScore').textContent = GS.score;
  document.getElementById('hudLevel').textContent = GS.level;
  document.getElementById('hudLives').textContent = '♥ '.repeat(GS.lives).trim() || '☆ GAME OVER';
}

/* Ship SVG path helper */
function drawShip(x, y, col='#00ff41') {
  const s = GS.ship.w / 16;
  gc.save();
  gc.translate(x - GS.ship.w/2, y - GS.ship.h/2);
  // White tip
  gc.fillStyle = '#fff';
  gc.fillRect(7*s, 0, 2*s, 4*s);
  // Main body
  gc.fillStyle = col;
  gc.fillRect(6*s, 4*s, 4*s, 6*s);
  gc.fillRect(4*s, 6*s, 8*s, 4*s);
  // Dark base
  gc.fillStyle = '#008f11';
  gc.fillRect(2*s, 10*s, 12*s, 2*s);
  // Thrusters
  gc.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--r').trim() || '#ff0055';
  gc.fillRect(0, 12*s, 4*s, 4*s);
  gc.fillRect(12*s, 12*s, 4*s, 4*s);
  // Engine flame
  gc.fillStyle = col;
  gc.fillRect(7*s, 10*s, 2*s, 6*s);
  gc.restore();

  // Ship glow
  gc.save();
  gc.shadowColor = col;
  gc.shadowBlur = 18;
  gc.fillStyle = 'transparent';
  gc.fillRect(x-2,y-2,4,4);
  gc.restore();
}

function drawEnemy(e) {
  const s = e.w / 15;
  gc.save();
  gc.translate(e.x - e.w/2, e.y - e.h/2);
  gc.fillStyle = e.color;
  gc.shadowColor = e.color;
  gc.shadowBlur = 8;
  // Invader pixel art
  gc.fillRect(4*s,0,7*s,s);gc.fillRect(3*s,s,9*s,s);gc.fillRect(2*s,2*s,11*s,s);
  gc.fillRect(2*s,3*s,2*s,s);gc.fillRect(5*s,3*s,5*s,s);gc.fillRect(11*s,3*s,2*s,s);
  gc.fillRect(0,4*s,15*s,s);gc.fillRect(2*s,5*s,2*s,s);gc.fillRect(5*s,5*s,5*s,s);gc.fillRect(11*s,5*s,2*s,s);
  gc.restore();
}

function spawnEnemy() {
  const col = ['#ff0055','#ff4fd8','#ff6633','#aa00ff'][Math.floor(Math.random()*4)];
  GS.enemies.push({
    x: 40 + Math.random() * (gameCanvas.width - 80),
    y: -30,
    w: 44, h: 30,
    color: col,
    speed: 1.5 + GS.level * 0.4 + Math.random() * 1.5,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.04 + Math.random() * 0.03,
    active: true,
  });
}

function spawnParticles(x, y, color, count=12) {
  for (let i=0; i<count; i++) {
    const angle = (Math.PI*2/count)*i + Math.random()*.5;
    const speed = 2 + Math.random()*4;
    GS.particles.push({
      x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 1, decay: .03+Math.random()*.04, size: 2+Math.random()*4,
      color
    });
  }
}

function gameLoop() {
  if (!GS.running) return;
  gc.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
  GS.frameCount++;

  /* Level progression */
  if (GS.frameCount % 600 === 0) {
    GS.level++;
    GS.spawnInterval = Math.max(30, 90 - GS.level * 8);
    GS.bulletInterval = Math.max(10, 18 - GS.level);
    SND.level();
    updateHUD();
  }

  /* Ship smooth movement */
  GS.ship.x += (GS.ship.targetX - GS.ship.x) * 0.12;
  GS.ship.y = gameCanvas.height - 80;

  /* Spawn enemies */
  GS.spawnTimer++;
  if (GS.spawnTimer >= GS.spawnInterval) { spawnEnemy(); GS.spawnTimer=0; }

  /* Auto-fire */
  GS.bulletTimer++;
  if (GS.bulletTimer >= GS.bulletInterval) {
    GS.bullets.push({ x: GS.ship.x, y: GS.ship.y - GS.ship.h/2, speed: 16 });
    SND.shoot();
    GS.bulletTimer=0;
  }

  /* Update bullets */
  GS.bullets = GS.bullets.filter(b => b.y > -20);
  GS.bullets.forEach(b => {
    b.y -= b.speed;
    const shipCol = getComputedStyle(document.documentElement).getPropertyValue('--g').trim() || '#00ff41';
    gc.fillStyle = shipCol;
    gc.shadowColor = shipCol;
    gc.shadowBlur = 10;
    gc.fillRect(b.x-2, b.y, 4, 18);
    gc.shadowBlur = 0;
  });

  /* Update enemies */
  GS.enemies = GS.enemies.filter(e => e.active && e.y < gameCanvas.height + 50);
  GS.enemies.forEach(e => {
    if (!e.active) return;
    e.y += e.speed;
    e.wobble += e.wobbleSpeed;
    e.x += Math.sin(e.wobble) * 1.5;

    /* Bullet-enemy collision */
    GS.bullets.forEach(b => {
      if (!e.active) return;
      if (b.x > e.x-e.w/2 && b.x < e.x+e.w/2 && b.y < e.y+e.h/2 && b.y > e.y-e.h/2) {
        e.active = false;
        b.y = -999;
        GS.score += 100 * GS.level;
        spawnParticles(e.x, e.y, e.color, 14);
        SND.explode();
        updateHUD();
      }
    });

    /* Enemy reaches bottom */
    if (e.y > gameCanvas.height - 20) {
      e.active = false;
      GS.lives--;
      spawnParticles(e.x, gameCanvas.height-30, '#ff0055', 20);
      SND.die();
      updateHUD();
      if (GS.lives <= 0) {
        setTimeout(()=>{ stopGame(); }, 1500);
        return;
      }
    }

    if (e.active) drawEnemy(e);
  });

  /* Update particles */
  GS.particles = GS.particles.filter(p => p.life > 0);
  GS.particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1; // gravity
    p.life -= p.decay;
    gc.globalAlpha = p.life;
    gc.fillStyle = p.color;
    gc.shadowColor = p.color;
    gc.shadowBlur = 6;
    gc.fillRect(p.x, p.y, p.size, p.size);
    gc.shadowBlur = 0;
    gc.globalAlpha = 1;
  });

  /* Draw ship */
  const shipCol = getComputedStyle(document.documentElement).getPropertyValue('--g').trim() || '#00ff41';
  drawShip(GS.ship.x, GS.ship.y, shipCol);

  /* Ground line */
  gc.strokeStyle = 'rgba(0,255,65,.15)';
  gc.lineWidth = 1;
  gc.beginPath();
  gc.moveTo(0, gameCanvas.height - 30);
  gc.lineTo(gameCanvas.width, gameCanvas.height - 30);
  gc.stroke();

  requestAnimationFrame(gameLoop);
}

/* ──── INPUT HANDLING ─────────────────────────────── */
window.addEventListener('mousemove', e => {
  GS.ship.targetX = e.clientX;
});
window.addEventListener('touchmove', e => {
  e.preventDefault();
  GS.ship.targetX = e.touches[0].clientX;
}, { passive: false });

window.addEventListener('wheel', e => {
  if (e.deltaY > 30 && !GS.running) startGame();
});

let touchStart = 0;
window.addEventListener('touchstart', e => { touchStart = e.touches[0].clientY; });
window.addEventListener('touchend', e => {
  if (!GS.running && touchStart - e.changedTouches[0].clientY > 60) startGame();
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && GS.running) stopGame();
  if (e.key === 'Enter' && !GS.running) startGame();
});

window.addEventListener('resize', () => {
  if (GS.running) {
    gameCanvas.width = window.innerWidth;
    gameCanvas.height = window.innerHeight;
  }
});
</script>
</body>
