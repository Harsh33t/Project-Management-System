<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS PAM — REGISTER</title>
    <meta name="description" content="Enlist as a new operative in the NEXUS PAM mission control system." />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <canvas id="starfield"></canvas>
    <div class="scanline-overlay"></div>

    <div class="auth-container" id="authContainer">
      <!-- NEXUS PAM Logo -->
      <div class="logo-section">
        <div class="pixel-ship">
          <svg viewBox="0 0 16 16" width="64" height="64">
            <rect x="7" y="0" width="2" height="4" fill="#ffffff"></rect>
            <rect x="6" y="4" width="4" height="6" fill="#00ff41"></rect>
            <rect x="4" y="6" width="8" height="4" fill="#00ff41"></rect>
            <rect x="2" y="10" width="12" height="2" fill="#008f11"></rect>
            <rect x="0" y="12" width="4" height="4" fill="#ff0055"></rect>
            <rect x="12" y="12" width="4" height="4" fill="#ff0055"></rect>
            <rect x="7" y="10" width="2" height="6" fill="#00ff41"></rect>
          </svg>
        </div>
        <h1 class="logo-title">
          <span class="logo-nexus">NEXUS</span>
          <span class="logo-pam">PAM</span>
        </h1>
        <div class="subtitle">
          ENLIST AS NEW OPERATIVE<span class="cursor-blink">_</span>
        </div>
      </div>

      <!-- Register Box -->
      <div class="auth-box" id="registerBox">
        <div class="auth-header">[ NEW RECRUIT FORM ]</div>

        <form id="registerForm" autocomplete="off">
          <div class="input-group">
            <label for="regUsername">USERNAME:</label>
            <input type="text" id="regUsername" name="username" placeholder="CHOOSE CALLSIGN" required minlength="3" maxlength="20" autocomplete="username" />
          </div>
          <div class="input-group">
            <label for="regEmail">EMAIL:</label>
            <input type="email" id="regEmail" name="email" class="no-uppercase" placeholder="OPERATIVE@NEXUS.COM" required autocomplete="email" />
          </div>
          <div class="input-group">
            <label for="regPassword">PASSWORD:</label>
            <input type="password" id="regPassword" name="password" placeholder="●●●●●●●●" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="input-group">
            <label for="regConfirm">CONFIRM PASSWORD:</label>
            <input type="password" id="regConfirm" name="confirmPassword" placeholder="●●●●●●●●" required minlength="6" autocomplete="new-password" />
          </div>

          <button type="submit" class="btn-enter" id="registerBtn">
            <span class="btn-arrow">▶</span> ENLIST OPERATIVE
          </button>
        </form>

        <div class="divider-or">
          <span>── OR ──</span>
        </div>

        <button class="btn-google" id="googleRegisterBtn">
          <span class="google-icon">[G]</span> CONTINUE WITH GOOGLE
        </button>

        <div class="auth-footer">
          RETURNING COMMANDER? <a href="/login.html" class="auth-link">[LOGIN HERE]</a>
        </div>
      </div>

      <!-- Status Messages -->
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <canvas id="matrixCanvas" class="matrix-canvas"></canvas>
    <div class="red-flash" id="redFlash"></div>
    <div class="success-overlay" id="successOverlay">
      <div class="success-text" id="successText"></div>
    </div>

    <script src="/auth.js"></script>
    <script src="/dotted-surface.js"></script>
</body>
</html>
