<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — XP Leaderboard & Achievements</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" /><link rel="stylesheet" href="/chatbot.css" />
  <style>
    .leaderboard-table { width:100%; border-collapse:collapse; }
    .leaderboard-table th { font-family:'Press Start 2P'; font-size:.45rem; color:rgba(255,255,255,.4); text-align:left; padding:8px 12px; border-bottom:1px solid var(--g-dim); }
    .leaderboard-table td { padding:10px 12px; border-bottom:1px solid rgba(0,255,65,.06); font-family:'VT323'; font-size:1rem; }
    .rank-num { font-family:'Press Start 2P'; font-size:.7rem; }
    .rank-num.gold { color:var(--y); text-shadow: 0 0 10px rgba(255,215,0,.5); }
    .rank-num.silver { color:#aaa; }
    .rank-num.bronze { color:#cd7f32; }
    .xp-bar-wrap { width:120px; height:8px; background:var(--g-dim); border-radius:2px; }
    .xp-bar-fill { height:100%; background:var(--g); border-radius:2px; transition:width .5s; }
    .pilot-row:hover td { background:rgba(0,255,65,.04); }
    .pilot-row.me td { background:rgba(0,255,65,.06); }
    .pilot-row.me .pilot-name { color:var(--g); font-weight:bold; }
    .ach-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
    .ach-card {
      border:1px solid var(--g-dim); padding:14px; display:flex; gap:10px; align-items:flex-start;
      transition:.2s; background:rgba(0,0,0,.3);
    }
    .ach-card.unlocked { border-color:var(--g); background:rgba(0,255,65,.05); }
    .ach-card.locked { opacity:.4; filter:grayscale(.8); }
    .ach-icon { font-size:1.8rem; flex-shrink:0; line-height:1; }
    .ach-name { font-family:'Press Start 2P'; font-size:.5rem; color:var(--g); margin-bottom:4px; }
    .ach-name.locked { color:rgba(255,255,255,.3); }
    .ach-desc { font-family:'VT323'; font-size:.85rem; color:rgba(255,255,255,.5); }
    .ach-badge { font-size:.45rem; padding:2px 6px; background:var(--g); color:#000; font-family:'Press Start 2P'; margin-top:4px; display:inline-block; }
  </style>
</head>
<body>
<nav class="navbar"><div class="navbar-inner">
  <div class="logo-wrapper" onclick="window.location.href='/index.html'" style="cursor:pointer;display:flex;align-items:center;gap:8px;">
    <span style="color:var(--g);font-size:1.25rem;">NEXUS</span>
    <span style="display:flex;align-items:center;gap:4px;font-size:1.25rem;">P<svg style="width:1.2rem;height:1.2rem" viewBox="0 0 16 16"><rect x="7" y="0" width="2" height="4" fill="#fff"/><rect x="6" y="4" width="4" height="6" fill="#00ff41"/><rect x="4" y="6" width="8" height="4" fill="#00ff41"/><rect x="2" y="10" width="12" height="2" fill="#008f11"/><rect x="0" y="12" width="4" height="4" fill="#ff0055"/><rect x="12" y="12" width="4" height="4" fill="#ff0055"/></svg>M</span>
  </div>
  <div class="nav-right">
    <a class="nav-link" href="/dashboard.html">[DASHBOARD]</a>
    <a class="nav-link" href="/projects.html">[PROJECTS]</a>
    <a class="nav-link active" href="/leaderboard.html">[LEADERBOARD]</a>
    <a class="nav-link" href="/teams.html">[SQUADS]</a>
    <div id="currentUserSelect" class="nav-link" style="border-color:var(--y);color:var(--y);pointer-events:none;padding:6px 12px;"></div>
    <button style="border-color:#ff3d3d;color:#ff8a8a;font-size:.65rem;padding:6px 12px" onclick="localStorage.removeItem('nexus_token');localStorage.removeItem('nexus_user');window.location.href='/login.html'">[LOGOUT]</button>
  </div>
</div></nav>

<main class="page-root"><div class="content-wrap">

  <!-- Leaderboard -->
  <section class="panel" style="margin-bottom:16px; border-color:var(--y)">
    <h1 class="page-title" style="color:var(--y)">▸ PILOT LEADERBOARD</h1>
    <table class="leaderboard-table">
      <thead><tr>
        <th>RANK</th><th>CALL SIGN</th><th>TITLE</th><th>LEVEL</th><th>XP PROGRESS</th><th>OPS DONE</th><th>MEDALS</th>
      </tr></thead>
      <tbody id="leaderBody"></tbody>
    </table>
  </section>

  <!-- Achievements -->
  <section class="panel" style="border-color:var(--m)">
    <h2 class="page-title" style="color:var(--m)">▸ MEDAL COLLECTION</h2>
    <div style="font-size:.7rem;color:rgba(255,255,255,.4);margin-bottom:12px;font-family:'VT323'" id="achCount"></div>
    <div class="ach-grid" id="achGrid"></div>
  </section>

</div></main>

<script src="/auth-guard.js"></script>
<script src="/chatbot.js"></script>
<script>
const me = JSON.parse(localStorage.getItem('nexus_user')||'{}');
const username = me.username||me.name||'OPERATIVE';
document.getElementById('currentUserSelect').textContent = `[ ${username} ]`;
const token = ()=>localStorage.getItem('nexus_token');
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function load() {
  const [lbRes, achRes] = await Promise.all([
    fetch('/api/leaderboard', { headers:{ 'x-user':username,'Authorization':`Bearer ${token()}` } }),
    fetch('/api/achievements', { headers:{ 'x-user':username,'Authorization':`Bearer ${token()}` } })
  ]);
  const lb = await lbRes.json();
  const achs = await achRes.json();
  renderLeaderboard(lb);
  renderAchievements(achs);
}

function renderLeaderboard(lb) {
  const RANK_ICONS = ['🥇','🥈','🥉'];
  const RANK_CSS = ['gold','silver','bronze'];
  const body = document.getElementById('leaderBody');
  if(!lb.length) { body.innerHTML=`<tr><td colspan="7" style="text-align:center;opacity:.4;padding:24px">NO PILOTS REGISTERED</td></tr>`; return; }
  const maxXp = Math.max(...lb.map(p=>p.xp), 1);
  body.innerHTML = lb.map((p,i)=>{
    const isMe = p.username === username;
    const rankNum = i<3 ? `<span>${RANK_ICONS[i]}</span>` : `<span class="rank-num" style="color:rgba(255,255,255,.4)">#${i+1}</span>`;
    const xpPct = Math.round(p.xp/maxXp*100);
    return `<tr class="pilot-row ${isMe?'me':''}">
      <td>${rankNum}</td>
      <td class="pilot-name" style="font-family:'Press Start 2P';font-size:.6rem;font-weight:bold">${esc(p.username)} ${isMe?'◀ YOU':''}</td>
      <td style="color:var(--g);font-family:'Press Start 2P';font-size:.5rem">${esc(p.rank)}</td>
      <td style="color:var(--c);font-family:'Press Start 2P';font-size:.6rem">LVL ${p.level}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="xp-bar-wrap"><div class="xp-bar-fill" style="width:${xpPct}%"></div></div>
          <span style="color:var(--y);font-size:.8rem">${p.xp} PX</span>
        </div>
      </td>
      <td style="color:rgba(255,255,255,.6)">${p.tasksCompleted}</td>
      <td style="color:var(--m)">${'🏅'.repeat(Math.min(p.achievements,8))} <span style="color:rgba(255,255,255,.4);font-size:.8rem">${p.achievements > 8 ? '+' + (p.achievements-8) : ''}</span></td>
    </tr>`;
  }).join('');
}

function renderAchievements(achs) {
  const unlocked = achs.filter(a=>a.unlocked).length;
  document.getElementById('achCount').textContent = `${unlocked} / ${achs.length} MEDALS UNLOCKED`;
  document.getElementById('achGrid').innerHTML = [...achs].sort((a,b)=>b.unlocked-a.unlocked).map(a=>`
    <div class="ach-card ${a.unlocked?'unlocked':'locked'}">
      <div class="ach-icon">${a.icon}</div>
      <div>
        <div class="ach-name ${a.unlocked?'':'locked'}">${esc(a.name)}</div>
        <div class="ach-desc">${esc(a.desc)}</div>
        ${a.unlocked ? '<span class="ach-badge">UNLOCKED ✓</span>' : '<span style="font-size:.5rem;color:rgba(255,255,255,.25);font-family:\'Press Start 2P\'">LOCKED 🔒</span>'}
      </div>
    </div>
  `).join('');
}

load();
</script>
<footer class="system-footer"><span>[ OXYGEN: 98% ]</span><span class="blink">_ HALL OF GLORY _</span></footer>
</body></html>
