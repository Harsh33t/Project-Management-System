<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/chatbot.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <div class="logo-wrapper" onclick="window.location.href='/index.html'" style="cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none;">
          <span style="color: #00ff41; font-size: 1.25rem; text-shadow: 0 0 15px rgba(0,255,65,0.5);">NEXUS</span>
          <span style="display: flex; align-items: center; gap: 4px; color: #fff; font-size: 1.25rem; text-shadow: 0 0 5px #fff;">
            P<svg style="width: 1.2rem; height: 1.2rem; filter: drop-shadow(0 0 5px rgba(0,255,65,0.5));" viewBox="0 0 16 16"><rect x="7" y="0" width="2" height="4" fill="#ffffff"></rect><rect x="6" y="4" width="4" height="6" fill="#00ff41"></rect><rect x="4" y="6" width="8" height="4" fill="#00ff41"></rect><rect x="2" y="10" width="12" height="2" fill="#008f11"></rect><rect x="0" y="12" width="4" height="4" fill="#ff0055"></rect><rect x="12" y="12" width="4" height="4" fill="#ff0055"></rect></svg>M
          </span>
        </div>
        <div class="nav-right">
          <a class="nav-link" href="/index.html">[HOME]</a>
          <a class="nav-link" href="/dashboard.html">[DASHBOARD]</a>
          <a class="nav-link active" href="/projects.html">[PROJECTS]</a>
          <a class="nav-link" href="/activity.html">[ACTIVITY]</a>
          <select id="currentUserSelect"></select>
          <button id="logoutBtn" style="border-color:#ff3d3d;color:#ff8a8a;font-size:.65rem;padding:6px 12px" onclick="localStorage.removeItem('nexus_token');localStorage.removeItem('nexus_user');window.location.href='/login.html'">[LOGOUT]</button>
        </div>
      </div>
    </nav>

    <main class="page-root">
      <div class="content-wrap">
        <section class="panel">
          <div class="controls-row">
            <input id="searchProject" placeholder="SEARCH..." />
            <select id="filterProjectStatus"><option value="">ALL STATUS</option><option value="planned">PLANNED</option><option value="active">ACTIVE</option><option value="completed">COMPLETED</option></select>
            <select id="sortProjects"><option value="createdAt">CREATION DATE</option><option value="deadline">DEADLINE</option></select>
          </div>
        </section>

        <section class="panel">
          <div id="createToggle" class="collapser">
            <h2 class="page-title">▸ CREATE NEW PROJECT</h2>
            <span id="createToggleSymbol">[+]</span>
          </div>
          <div id="createBody" class="project-create-body" style="display:none">
            <div class="row-2">
              <input id="projectTitle" placeholder="PROJECT TITLE" />
              <select id="projectStatus"><option value="planned">PLANNED</option><option value="active">ACTIVE</option><option value="completed">COMPLETED</option></select>
            </div>
            <textarea id="projectDescription" rows="4" placeholder="DESCRIPTION"></textarea>
            <div class="row-3">
              <input id="projectDeadline" type="date" />
              <button id="createProjectBtn" class="right">CREATE</button>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2 class="page-title">▸ MISSION BOARDS</h2>
          <div id="projects"></div>
        </section>
      </div>
    </main>

    <dialog id="previewModal" class="preview-modal">
      <div class="panel" style="padding:12px">
        <div class="heading-row"><h3 id="previewTitle" class="page-title" style="font-size:.95rem">PREVIEW</h3><button id="closePreview" class="btn-danger">CLOSE</button></div>
        <div id="previewBody"></div>
      </div>
    </dialog>
    <script src="/auth-guard.js"></script>
    <script src="/app.js"></script>
    <script src="/chatbot.js"></script>
    <script src="/dotted-surface.js"></script>
  <footer class="system-footer"><span>[ OXYGEN: 98% ]</span><span>[ SHIELDS: ACTIVE ]</span><span class="blink">_ UPTIME: OK _</span></footer>
  <script src="/dotted-surface.js"></script>
</body>
</html>
